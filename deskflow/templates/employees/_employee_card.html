<div class="employee-card">
    {% load static %}
    <div class="card-image">
        {% if employee.main_image %}
            <img src="{{ employee.main_image.image.url }}" alt="Фото {{ employee.first_name }} {{ employee.last_name }}">
        {% else %}
            <img src="{% static 'img/default.png' %}" alt="Нет фото">
        {% endif %}
    </div>

    <div class="card-body">
        <h3>{{ employee.first_name }} {{ employee.last_name }}</h3>

        <div class="skills-tags">
            <span class="skills-label">Навыки:</span>
            {% for skill in employee.skills.all %}
                <span class="skill-tag">{{ skill.name }}</span>
            {% empty %}
                <span class="skill-tag skill-tag--empty">Нет навыков</span>
            {% endfor %}
        </div>

        <p><strong>Стаж:</strong> {{ employee.experience_days }} дней</p>

        <a href="{% url 'employee_detail' employee.pk %}" class="btn-details">Подробнее</a>
    </div>
</div>
